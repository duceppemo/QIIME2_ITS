name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -v --cov=qiime2_its --cov-report=term-missing --cov-report=xml
      # Upload once. Dependabot pull requests cannot read the CODECOV_TOKEN secret, so they skip the upload.
      - uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # Strict on pushes, to notice a broken Codecov setup; a Codecov hiccup should not fail a pull request.
          fail_ci_if_error: ${{ github.event_name == 'push' && secrets.CODECOV_TOKEN != '' }}
