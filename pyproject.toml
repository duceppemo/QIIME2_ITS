[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiime2-its"
version = "0.2.0"
description = "QIIME2 ITS metabarcoding pipeline for single-end (IonTorrent) and paired-end (Illumina) data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "duceppemo" }]
dependencies = [
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
]

[project.scripts]
qiime2-its = "qiime2_its.cli.pipeline:main"
qiime2-its-rc = "qiime2_its.cli.fastq_rc:main"
qiime2-its-train-unite = "qiime2_its.cli.train_unite:main"
qiime2-its-train-ncbi = "qiime2_its.cli.train_ncbi:main"
qiime2-its-train-fasta = "qiime2_its.cli.train_fasta:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
