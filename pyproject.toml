[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiime2-its"
version = "0.2.1"
description = "QIIME2 ITS metabarcoding pipeline for single-end (IonTorrent) and paired-end (Illumina) data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duceppemo" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.81",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "fpdf2>=2.7",
]

[project.urls]
Homepage = "https://github.com/duceppemo/QIIME2_ITS"
Repository = "https://github.com/duceppemo/QIIME2_ITS"
Documentation = "https://github.com/duceppemo/QIIME2_ITS/wiki"
Issues = "https://github.com/duceppemo/QIIME2_ITS/issues"
Changelog = "https://github.com/duceppemo/QIIME2_ITS/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
]

[project.scripts]
qiime2-its = "qiime2_its.cli.pipeline:main"
qiime2-its-rc = "qiime2_its.cli.fastq_rc:main"
qiime2-its-train-unite = "qiime2_its.cli.train_unite:main"
qiime2-its-train-ncbi = "qiime2_its.cli.train_ncbi:main"
qiime2-its-train-fasta = "qiime2_its.cli.train_fasta:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qiime2_its = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
